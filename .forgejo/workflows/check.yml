name: Flake Check
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: nixos-nymph
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Run check
        run: nix flake check --all-systems
