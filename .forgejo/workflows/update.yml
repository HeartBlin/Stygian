name: Update packages
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  check:
    runs-on: nixos-nymph
    steps:
      - uses: actions/checkout@v5

      - name: Create update branch
        run: |
          set -euo pipefail

          BRANCH="auto/package-updates-$(date +%s)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git switch -c "$BRANCH"

          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@localhost"

      - name: Bump packages
        id: bump
        run: |
          set -uo pipefail
          shopt -s nullglob

          BLACKLIST=(
            alejandra-custom
            macbook-pro-late-black
          )
          failed=()

          for file in packages/*/default.nix; do
            package="${file#packages/}"
            package="${package%/default.nix}"

            if [[ " ${BLACKLIST[*]} " == *" $package "* ]]; then
              echo "::notice::Skipping $package (blacklisted)"
              continue
            fi

            echo "::group::Updating $package"

            args=(--flake --commit)
            version=$(nix eval --raw ".#$package.version" 2>/dev/null || true)
            if [[ "$version" == *-unstable-* ]]; then
              args+=(--version=branch)
            fi

            before=$(git rev-parse HEAD)
            ok=true
            nix-update "${args[@]}" "$package" || ok=false

            if $ok && [[ "$(git rev-parse HEAD)" != "$before" ]]; then
              nix build --no-link ".#$package" || ok=false
            fi

            if ! $ok; then
              echo "::warning::Update of $package failed, reverting it"
              failed+=("$package")
              git reset --hard -q "$before"
              git clean -fdq -- "packages/$package"
            fi
            echo "::endgroup::"
          done

          echo "failed=${failed[*]:-}" >> "$GITHUB_OUTPUT"

      - name: Verify flake
        run: nix flake check

      - name: Push changes
        id: changes
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]; then
            echo "No updates available."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open a PR
        if: steps.changes.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          HOST="${GITHUB_SERVER_URL#*://}"

          fj auth logout "$HOST" || true
          fj -H "$HOST" auth add-token "$TOKEN"

          body="$(printf 'Automated package updates.\n\n%s\n' \
            "$(git log --format='- %s' "$BASE_SHA..HEAD")")"

          fj -H "$HOST" pr create "Automated package updates" \
            --head "$BRANCH" \
            --base main \
            --body "$body"

      - name: Report failed packages
        if: steps.bump.outputs.failed != ''
        env:
          FAILED: ${{ steps.bump.outputs.failed }}
        run: |
          echo "::error::Update failed for: $FAILED"
          exit 1
