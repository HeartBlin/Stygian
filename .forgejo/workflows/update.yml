name: Update packages
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  check:
    runs-on: nixos-nymph
    steps:
      - uses: actions/checkout@v7

      - name: Create update branch
        run: |
          BRANCH="auto/package-updates-$(date +%s)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git switch -c "$BRANCH"

      - name: Bump packages
        run: |
          set -euo pipefail
          shopt -s nullglob

          BLACKLIST=(
            alejandra-custom
            macbook-pro-late-black
          )

          for file in packages/*/default.nix; do
            package="${file#packages/}"
            package="${package%/default.nix}"

            if [[ " ${BLACKLIST[*]} " == *" $package "* ]]; then
              echo "::notice::Skipping $package (blacklisted)"
              continue
            fi

            echo "::group::Updating $package"
            if ! nix-update "$package" --flake; then
              echo "::endgroup::"
              echo "::error::nix-update failed for $package"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Commit and push changes
        id: changes
        run: |
          git add -A -- packages/

          if git diff --cached --quiet; then
            echo "No updates available."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@localhost"
          git commit -m "chore: update packages"
          git push origin "$BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open a PR
        if: steps.changes.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          HOST="${GITHUB_SERVER_URL#*://}"

          # Clear potential stale data
          fj auth logout "$HOST"
          printf '%s\n' "$TOKEN" | fj -H "$HOST" auth add-key forgejo-actions
          fj -H "$HOST" pr create "Automated package updates" \
            --head "$BRANCH" \
            --base main \
            --body "This PR was automatically generated by a Forgejo workflow."
